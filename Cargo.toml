# Virtual workspace root (docs/terrain-editor-design.md §7). The renderer and the
# editor crates (bevy_wilderness_editor, _editor_ui — later phases) live under
# crates/; a shared Cargo.lock keeps one bevy version across all of them.
[workspace]
resolver = "3"
members = ["crates/*"]

# Profile overrides apply workspace-wide and must live in the root manifest.
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
