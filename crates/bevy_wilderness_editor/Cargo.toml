[package]
name = "bevy_wilderness_editor"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Embeddable terrain editor core for bevy_wilderness — sculpt, mask, erosion; UI-agnostic"
repository = "https://github.com/stevesloan/bevy_wilderness"

[dependencies]
bevy = "0.19.0"
bevy_wilderness = { path = "../bevy_wilderness", version = "0.1.0", features = [
    "editing",
] }
# Writes the 16-bit PNG interchange export (D7); already in bevy's tree.
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
# Parses the hand-written KTX2 export in tests (same version bevy loads with).
ktx2 = "0.5"
# The erosion tests drive the GPU sim against a headless device (bevy's own
# wgpu version; tests skip gracefully when the machine has no adapter), and
# naga validates the embedded WGSL without needing any GPU at all.
wgpu = "29"
naga = { version = "29", features = ["wgsl-in"] }

